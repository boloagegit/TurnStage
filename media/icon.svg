      <stop offset="1" stop-color="#121d33"/>
    </linearGradient>
    <radialGradient id="turnstage-light" cx="0" cy="0" r="1" gradientTransform="translate(75 42) rotate(48) scale(190)" gradientUnits="userSpaceOnUse">
