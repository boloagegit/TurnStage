<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="TurnStage conversation testing icon">
  <defs>
    <linearGradient id="turnstage-bg" x1="30" y1="18" x2="226" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080c14"/>
      <stop offset="0.58" stop-color="#101a2d"/>
      <stop offset="1" stop-color="#17243d"/>
    </linearGradient>
    <radialGradient id="turnstage-light" cx="0" cy="0" r="1" gradientTransform="translate(72 40) rotate(48) scale(198)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#304b72" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#172a48" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a101c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turnstage-frame" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#edf2f9"/>
      <stop offset="1" stop-color="#aebbd0"/>
    </linearGradient>
    <linearGradient id="turnstage-flow" x1="10" y1="5" x2="16" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ef2e7"/>
      <stop offset="0.5" stop-color="#53c7ff"/>
      <stop offset="1" stop-color="#7787ff"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#turnstage-bg)"/>
  <rect width="256" height="256" rx="52" fill="url(#turnstage-light)"/>

  <!-- The product mark uses the exact Activity Bar geometry, scaled from its 24px viewBox. -->
  <g transform="scale(10.6666666667)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect stroke="url(#turnstage-frame)" stroke-width="1.8" x="2.5" y="2.5" width="19" height="19" rx="3.25"/>
      <path stroke="url(#turnstage-flow)" stroke-width="1.8" d="M12 6.4v4.9m0 0-4.25 4.5m4.25-4.5 4.25 4.5"/>
    </g>
    <g fill="url(#turnstage-flow)">
      <circle cx="12" cy="6.4" r="1.3"/>
      <circle cx="7.75" cy="15.8" r="1.3"/>
      <rect x="14.95" y="14.5" width="2.6" height="2.6" rx="0.58"/>
    </g>
  </g>
</svg>
