<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="TurnStage">
  <defs>
    <linearGradient id="turnstage-tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1526"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <radialGradient id="turnstage-light" cx="0" cy="0" r="1" gradientTransform="translate(70 40) rotate(50) scale(210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a5a8c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3a5a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turnstage-bubble" x1="5" y1="3" x2="19" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ecfa"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#turnstage-tile)"/>
  <rect width="256" height="256" rx="56" fill="url(#turnstage-light)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#e6ecf8" stroke-opacity="0.13" stroke-width="3"/>

  <!-- The product mark uses the exact Activity Bar paths, scaled from its 24px viewBox; the bubble is filled for the tile. -->
  <g transform="translate(26 26) scale(8.5)">
    <path fill="url(#turnstage-bubble)" stroke="url(#turnstage-bubble)" stroke-width="1.2" stroke-linejoin="round" d="M7 3.5h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H10.5L6 21v-3.6A4 4 0 0 1 3 13.5v-6a4 4 0 0 1 4-4z"/>
    <path fill="none" stroke="#2f8cff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M6.5 10.5h3l1.6-3.2 2.4 6.2 1.6-3h2.4"/>
  </g>
</svg>
