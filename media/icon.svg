<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="TurnStage">
  <defs>
    <linearGradient id="turnstage-tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1222"/>
      <stop offset="1" stop-color="#1a2850"/>
    </linearGradient>
    <radialGradient id="turnstage-light" cx="0" cy="0" r="1" gradientTransform="translate(70 40) rotate(50) scale(210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a5a8c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0b1222" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turnstage-turns" x1="12" y1="3" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86f4e4"/>
      <stop offset="0.5" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#8f7cff"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#turnstage-tile)"/>
  <rect width="256" height="256" rx="56" fill="url(#turnstage-light)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#c8d6f0" stroke-opacity="0.14" stroke-width="3"/>

  <!-- The product mark uses the exact Activity Bar path, scaled from its 24px viewBox; the stroke and end nodes are heavier for the filled tile. -->
  <g transform="translate(26 26) scale(8.5)">
    <path fill="none" stroke="url(#turnstage-turns)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M17 5.5H8.75a3.25 3.25 0 0 0 0 6.5h6.5a3.25 3.25 0 0 1 0 6.5H7"/>
    <g fill="url(#turnstage-turns)">
      <circle cx="17.5" cy="5.5" r="2.4"/>
      <rect x="4.6" y="16.1" width="4.8" height="4.8" rx="1.1"/>
    </g>
  </g>
</svg>
