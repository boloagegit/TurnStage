name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the jobs below run in full. A documentation-only change lets them
  # finish immediately while every required check is still reported. See scripts/ci-scope.mjs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: scope
        env:
          CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SCOPE_ALWAYS_FULL: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: node scripts/ci-scope.mjs

  verify:
    needs: changes
    # Runs even when the scope check fails: only an explicit full=false skips work.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full != 'false'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.full != 'false'
      - run: npm run typecheck
        if: needs.changes.outputs.full != 'false'
      - run: npm run lint
        if: needs.changes.outputs.full != 'false'
      - run: npm test
        if: needs.changes.outputs.full != 'false'
      - run: npm run test:web
        if: needs.changes.outputs.full != 'false'
      - name: Web profile folder generator tests
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        run: python3 -B -m unittest discover -s test -p 'test_*.py'
      - run: npm run compile
        if: needs.changes.outputs.full != 'false'
      - run: npm run web:build
        if: needs.changes.outputs.full != 'false'
      - name: Extension Host integration tests
        if: needs.changes.outputs.full != 'false' && runner.os != 'Linux'
        run: npm run test:integration
      - name: Extension Host integration tests (Linux)
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Minimum VS Code Extension Host integration tests (Linux)
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        env:
          TURNSTAGE_VSCODE_VERSION: 1.106.0
        run: xvfb-run -a npm run test:integration
      - run: npm run package
        if: needs.changes.outputs.full != 'false'
      - name: Installed VSIX mock integration tests
        if: needs.changes.outputs.full != 'false' && runner.os != 'Linux'
        timeout-minutes: 10
        env:
          TURNSTAGE_TEST_VSIX: auto
        run: node test/integration/runTest.mjs
      - name: Installed VSIX mock integration tests (Linux)
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          TURNSTAGE_TEST_VSIX: auto
        run: xvfb-run -a node test/integration/runTest.mjs
      - run: npm run package:web
        if: needs.changes.outputs.full != 'false'
      - name: Archive integrity (Linux)
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        run: |
          unzip -t "turnstage-$(node -p "require('./package.json').version").vsix"
          unzip -t "turnstage-web-$(node -p "require('./package.json').version").zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        with:
          name: turnstage-vsix
          path: '*.vsix'
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.full != 'false' && runner.os == 'Linux'
        with:
          name: turnstage-web
          path: 'turnstage-web-*.zip'
          retention-days: 14

  security:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            printf 'npm audit attempt %s failed; retrying in 15 seconds.\n' "$attempt"
            sleep 15
          done

  visual:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:visual
      - run: npm run web:build
      - name: Web and Webview mock journeys
        timeout-minutes: 45
        run: |
          node test/visual/interfacePolish.visual.mjs
          node test/visual/webJsoncVisual.visual.mjs
          node test/visual/richContent.visual.mjs
          node test/visual/webLibrary.visual.mjs
          node test/visual/webAbServices.visual.mjs
          node test/visual/webCaseScale.visual.mjs
          node test/visual/webRunControl.visual.mjs
          node test/visual/testReport.visual.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: turnstage-visual-regression
          path: artifacts/**
          retention-days: 14
