name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:web
      - name: Web profile folder generator tests
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s test -p 'test_*.py'
      - run: npm run compile
      - run: npm run web:build
      - name: Extension Host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Extension Host integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Minimum VS Code Extension Host integration tests (Linux)
        if: runner.os == 'Linux'
        env:
          TURNSTAGE_VSCODE_VERSION: 1.106.0
        run: xvfb-run -a npm run test:integration
      - run: npm run package
      - name: Installed VSIX mock integration tests
        if: runner.os != 'Linux'
        timeout-minutes: 10
        env:
          TURNSTAGE_TEST_VSIX: auto
        run: node test/integration/runTest.mjs
      - name: Installed VSIX mock integration tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          TURNSTAGE_TEST_VSIX: auto
        run: xvfb-run -a node test/integration/runTest.mjs
      - run: npm run package:web
      - name: Archive integrity (Linux)
        if: runner.os == 'Linux'
        run: |
          unzip -t "turnstage-$(node -p "require('./package.json').version").vsix"
          unzip -t "turnstage-web-$(node -p "require('./package.json').version").zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: turnstage-vsix
          path: '*.vsix'
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: turnstage-web
          path: 'turnstage-web-*.zip'
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            printf 'npm audit attempt %s failed; retrying in 15 seconds.\n' "$attempt"
            sleep 15
          done

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:visual
      - run: npm run web:build
      - name: Web and Webview mock journeys
        timeout-minutes: 20
        run: |
          node test/visual/interfacePolish.visual.mjs
          node test/visual/webJsoncVisual.visual.mjs
          node test/visual/richContent.visual.mjs
          node test/visual/webLibrary.visual.mjs
          node test/visual/webAbServices.visual.mjs
          node test/visual/webCaseScale.visual.mjs
          node test/visual/testReport.visual.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: turnstage-visual-regression
          path: artifacts/**
          retention-days: 14
