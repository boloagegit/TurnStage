name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to package
        required: true
        type: string

permissions: {}

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify requested version
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a stable x.y.z version." >&2; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package -- --out "turnstage-$RELEASE_VERSION.vsix"
      - name: Create checksum
        run: sha256sum "turnstage-$RELEASE_VERSION.vsix" > "turnstage-$RELEASE_VERSION.vsix.sha256"
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "turnstage-$RELEASE_VERSION.vsix" \
            "turnstage-$RELEASE_VERSION.vsix.sha256" \
            --target "$GITHUB_SHA" \
            --title "TurnStage $RELEASE_VERSION" \
            --generate-notes \
            --draft
