name: Feature request
description: Propose a provider-neutral improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the testing or debugging problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Explain who uses it, when, and what evidence should remain visible.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, compatibility, or performance boundaries
      description: Include scale, privacy, network, storage, or migration constraints when relevant.

