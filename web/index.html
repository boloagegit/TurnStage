<!doctype html>
<html lang="en" data-host="web">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: http: https:; connect-src http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 28 28'%3E%3Crect x='-2' y='-2' width='28' height='28' rx='6' fill='%23101a2d'/%3E%3Cpath fill='%23fff' stroke='%23fff' stroke-width='1.2' stroke-linejoin='round' d='M7 3.5h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H10.5L6 21v-3.6A4 4 0 0 1 3 13.5v-6a4 4 0 0 1 4-4z'/%3E%3Cpath fill='none' stroke='%232f8cff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M6.5 10.5h3l1.6-3.2 2.4 6.2 1.6-3h2.4'/%3E%3C/svg%3E" />
    <title>TurnStage Web</title>
    <script src="./theme-boot.js"></script>
    <style>
      /* First-paint shell: same geometry as the app, replaced when it mounts. */
      html, body { margin: 0; height: 100%; background: #0e0d0b; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f7f5f1; }
      body { background: var(--vscode-editor-background, inherit); }
      .boot-library { display: grid; align-content: start; gap: 10px; padding: 16px 12px; border-inline-end: 1px solid rgb(128 128 128 / 0.18); }
      .boot-main { display: grid; grid-template-columns: minmax(0, 64fr) minmax(0, 36fr); }
      .boot-chat { display: grid; align-content: start; gap: 14px; padding: 56px 24px 0; border-inline-end: 1px solid rgb(128 128 128 / 0.18); }
      .boot-pane { display: grid; align-content: start; gap: 10px; padding: 56px 16px 0; }
      .boot-bar { display: block; height: 12px; border-radius: 6px; background: rgb(128 128 128 / 0.14); }
      .boot-bubble { height: 34px; border-radius: 12px; }
      @media (max-width: 899px) { .boot-main { grid-template-columns: minmax(0, 1fr); } .boot-pane { display: none; } }
    </style>
  </head>
  <body>
    <div id="web-shell">
      <aside id="profile-root" aria-label="TurnStage profiles"><div class="boot-library" aria-hidden="true"><span class="boot-bar" style="width: 60%; height: 20px"></span><span class="boot-bar" style="height: 30px"></span><span class="boot-bar" style="width: 80%"></span><span class="boot-bar" style="width: 70%"></span><span class="boot-bar" style="width: 76%"></span></div></aside>
      <div id="root" data-instance-id="turnstage-web"><div class="boot-main" aria-busy="true" style="height: 100vh"><div class="boot-chat"><span class="boot-bar boot-bubble" style="justify-self: end; width: 46%"></span><span class="boot-bar boot-bubble" style="width: 72%"></span><span class="boot-bar boot-bubble" style="justify-self: end; width: 40%"></span></div><div class="boot-pane"><span class="boot-bar" style="width: 70%"></span><span class="boot-bar" style="width: 88%"></span><span class="boot-bar" style="width: 64%"></span><span class="boot-bar" style="width: 80%"></span></div></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
