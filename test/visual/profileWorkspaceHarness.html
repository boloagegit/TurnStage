<body>
  <div id="root" data-instance-id="visual-harness"></div>
  <script>
    const query = new URLSearchParams(location.search);
    const preset = query.get('preset') ?? 'split-inspector';
    const inspectorPosition = query.get('position') ?? 'right';
    const inspectorWidth = Number(query.get('width')) || undefined;
    const multiline = query.get('multiline') !== 'false';
    const showStopWhileStreaming = query.get('stop') !== 'false';
    const streamingEffect = query.get('effect') ?? 'caret';
    const streamingSpeed = Number(query.get('speed')) || 900;
    const streamingIntensity = Number(query.get('intensity')) || 70;
    const messageActions = query.has('actions') ? query.get('actions').split(',').filter(Boolean) : undefined;
    const messageActionVisibility = query.get('actionVisibility') ?? 'always';
    const active = query.get('active') === 'true';
    const viewportPresets = {
      'mobile-s': { width: 320, height: 568 },
      'mobile-m': { width: 375, height: 667 },
      'mobile-l': { width: 425, height: 812 },
      tablet: { width: 768, height: 1024 },
      laptop: { width: 1024, height: 768 },
      'laptop-l': { width: 1440, height: 900 }
    };
    const device = query.get('device');
    const viewportDefinition = viewportPresets[device];
    const chatViewport = viewportDefinition

      : { preset: 'responsive', width: 390, height: 844, zoom: 'fit' };
    const envelope = { protocolVersion: 1, editorInstanceId: 'visual-harness', requestId: 'visual-harness' };
    const profile = {
      version: 1,
      id: 'slow-sse-proof',
      name: 'Slow SSE Visual Proof',
      environment: 'local',
      conversation: { send: { method: 'POST', url: 'http://localhost/chat' } },
      stream: { transport: 'sse', mappings: [{ id: 'message', match: { event: 'message' }, emit: { type: 'content.text.delta', text: { path: '$.text' } } }] },
      opening: { mode: 'static', message: 'Send a message to watch six SSE events arrive over about 3.6 seconds.', starters: [] },
      ui: {
        layout: { preset, inspectorPosition, ...(inspectorWidth ? { inspectorWidth } : {}) },
        composer: { placeholder: 'Type a message for the slow SSE stream…', multiline, enterBehavior: 'send', showStopWhileStreaming },
        streaming: { effect: streamingEffect, speedMs: streamingSpeed, intensityPercent: streamingIntensity },
        messageActionVisibility,
        ...(messageActions ? { messageActions } : {}),
        components: { opening: { visible: true }, progress: { visible: true }, metrics: { visible: true }, messageMetrics: { visible: true } }

      metrics: { messageEnabled: ['ttft', 'totalDuration'] },
      tests: {
        adversarialSuites: ['.vscode/turnstage/tests/security-regression.adversarial.csv'],
        campaigns: [{
          id: 'release-safety',

          description: 'Repeat the known security probes before release.',

          coverageTags: ['regression', 'multi-turn', 'privacy']

        qualityRubrics: [{
          id: 'support-quality',
          name: 'Support response quality',
          description: 'Advisory review of the explicitly disclosed assistant response.',
          criteria: [{ id: 'relevance', label: 'Relevance', description: 'The response directly addresses the requested task without unrelated content.' }]

        reporting: { formats: ['json', 'junit', 'html'], outputDirectory: '.turnstage/reports' },
        visual: { baselineDirectory: '.turnstage/baselines', maxDifferencePercent: 0.1, channelTolerance: 16 },
        scenarios: [{
          id: 'slow-stream-contract',
          name: 'Slow stream contract',
          description: 'Checks the visible terminal response and event order.',
          controls: {},
          comparison: {
            baseline: { label: 'Current baseline', environment: 'local' },
            candidate: { label: 'Candidate build', environment: 'local' },
            ignorePaths: ['session.title']

          performance: {
            thresholds: { 'scenario.durationMs': 10000, 'metrics.ttft': 2500 },
            regression: { 'metrics.ttft': { maxIncreaseMs: 250, maxIncreasePercent: 15 } }

          steps: [{
            id: 'first-message',
            name: 'First message',
            input: 'Verify themed streaming layout',
            assertions: [

          assertions: [{ path: 'metrics.totalDuration', operator: 'lessThan', value: 10000 }]

          id: 'known-two-turn-probe',
          name: 'Known two-turn probe',
          description: 'Replays a fixed two-turn attack and forbids visible leakage.',
          tags: ['regression', 'multi-turn'],
          steps: [
            { id: 'context', name: 'Establish context', input: 'Explain the boundary.' },

          adversarial: {

            maxTurns: 2,

      errorPolicy: { allowContinuation: true }

    const networkEntries = [
      { id: 'opening-1', kind: 'opening', attempt: 1, method: 'POST', url: 'http://localhost/chat/opening', state: 'completed', startedAt: 800, completedAt: 920, status: 200, requestHeaders: { Accept: 'application/json', Authorization: 'Bearer local-debug-token' }, requestBody: { actorId: 'visual-user' }, responseHeaders: { 'content-type': 'application/json', 'set-cookie': '••••••••' }, responseBodyPreview: '{"message":"Welcome"}', timing: { headers: 84, total: 120, timeout: 10000 }, transferredBytes: 21, eventCount: 0 },
      { id: 'stream-1', kind: 'stream', attempt: 1, method: 'POST', url: 'http://localhost/chat/stream', variantId: 'first-turn', protocol: 'sse', state: 'completed', startedAt: 1000, completedAt: 4612, status: 200, requestHeaders: { Accept: 'text/event-stream', Authorization: 'Bearer local-debug-token' }, requestBody: { message: 'Verify themed streaming layout' }, responseHeaders: { 'content-type': 'text/event-stream' }, responseBodyPreview: 'event: start\ndata: {"conversationId":"conversation-1"}\n\nevent: done\ndata: {}', timing: { headers: 606, firstChunk: 606, total: 3612, timeout: 30000, idleTimeout: 5000 }, transferredBytes: 420, eventCount: 6 },
      { id: 'stream-2', kind: 'stream', attempt: 2, method: 'POST', url: 'http://localhost/chat/stream', variantId: 'continuation', protocol: 'sse', state: 'failed', startedAt: 5000, completedAt: 10200, status: 200, requestHeaders: { Accept: 'text/event-stream', Authorization: 'Bearer local-debug-token' }, requestBody: { message: 'Why did this time out?', cid: 'conversation-1' }, responseHeaders: { 'content-type': 'text/event-stream', 'set-cookie': '••••••••' }, responseBodyPreview: 'event: status\ndata: {"text":"Working"}', error: { type: 'IdleTimeoutError', message: 'No stream data was received within 5000 ms.', phase: 'streaming' }, timing: { headers: 190, firstChunk: 240, total: 5200, timeout: 30000, idleTimeout: 5000, retryDelay: 500 }, transferredBytes: 39, eventCount: 1, correlation: { traceId: '4bf92f3577b34da6a3ce929d0e0e4736', spanId: '00f067aa0ba902b7', traceFlags: '01', traceSource: 'response', requestId: 'visual-request-2', requestIdHeader: 'x-request-id' } }
    ];
    const snapshot = {
      sessionId: 'visual', sessionState: 'ready', turnState: active ? 'streaming' : 'completed', conversationId: 'conversation-1', title: 'Slow SSE Visual Proof', trusted: true, controls: {}, droppedEventCount: 0, errors: [], rawEvents,
      normalizedEvents: rawEvents.map((item) => ({ version: 1, type: item.sse.event, sequence: item.sequence, rawSequence: item.sequence, receivedAt: item.receivedAt })),
      messages: [
        { id: 'user-1', role: 'user', status: 'completed', createdAt: 1000, parts: [{ type: 'text', text: 'Verify themed streaming layout' }], citations: [], actions: [], followups: [], metadata: { rawSequences: [] } },
        { id: 'assistant-1', role: 'assistant', status: active ? 'streaming' : 'completed', createdAt: 1600, completedAt: active ? undefined : 4600, parts: [{ type: 'progress', text: 'Preparing the streamed response', status: active ? 'running' : 'completed' }, { type: 'text', text: 'Here is the sample result.' }], citations: [], actions: [], followups: [], timing: { ttft: 1808, totalDuration: active ? undefined : 3612 }, metrics: [{ id: 'e2e', label: 'E2E', value: 180, unit: 'ms', format: 'duration', aggregation: 'last', sampleCount: 1 }, { id: 'tokens', label: 'Tokens', value: 42, format: 'number', aggregation: 'sum', sampleCount: 2 }], metadata: { rawSequences: [1, 2, 3, 4, 5, 6] } }
      ],
      metrics: { eventCount: 6, byteCount: 420, parseErrorCount: 0, mappingErrorCount: 0, unmatchedEventCount: 0, totalDuration: 3612 }
    };
    const runs = [
      { id: 'replayable-run', profileId: profile.id, createdAt: 4600, replayable: true, hasSnapshot: true, metrics: snapshot.metrics, result: { type: 'completed' } },
      { id: 'metadata-only-run', profileId: profile.id, createdAt: 4000, replayable: false, hasSnapshot: false, metrics: { ...snapshot.metrics, eventCount: 0 }, result: { type: 'aborted', reason: 'user_cancel' } }
    ];
    const connectionResult = {
      protocol: 'sse', confidence: 'high', status: 200, rawEventCount: 6, normalizedEventCount: 6, mappedEventCount: 5, unmatchedEventCount: 1,
      parseErrorCount: 0, mappingErrorCount: 0, terminalEventSeen: true, terminalMapped: false, safe: false,
      findings: [
        { id: 'terminal-not-mapped', category: 'terminal', severity: 'error', message: 'A terminal event was observed but no terminal mapping completed the turn.' },
        { id: 'unmatched-events', category: 'mapping', severity: 'warning', message: 'One bounded stream event did not match any configured mapping.' }
      ]
    };
    const campaignDashboard = {
      profileId: profile.id,
      campaigns: [{
        definition: profile.tests.campaigns[0],
        baseline: { campaignId: 'release-safety', runId: 'baseline-run', acceptedAt: 900, sourceDigest: 'b'.repeat(64) },
        latest: {
          format: 'turnstage-campaign-run', version: 1, id: 'current-run', campaignId: 'release-safety', campaignName: 'Release safety', profileId: profile.id,
          createdAt: 1000, updatedAt: 5000, status: 'completed', sourceDigest: 'a'.repeat(64), baselineRunId: 'baseline-run',
          plan: { selectedCases: 1, plannedAttempts: 5, plannedTurns: 10, plannedRequests: 10, maximumDurationMs: 120000, maxConcurrency: 2 },
          cases: [{ key: `${profile.id}/inline/known-two-turn-probe`, profileId: profile.id, scenarioId: 'known-two-turn-probe', scenarioName: 'Known two-turn probe', tags: ['regression', 'multi-turn'], requestedAttempts: 5, completedAttempts: 5, plannedTurns: 10, outcome: 'attackSucceeded', stability: 'unstable', sampleComplete: true, counts: { resisted: 3, attackSucceeded: 2, indeterminate: 0, infrastructureError: 0 }, durationMs: 18050, ttftP95Ms: 1808 }],
          coverage: { requiredTags: ['multi-turn', 'privacy', 'regression'], coveredTags: ['multi-turn', 'regression'], missingTags: ['privacy'], caseCountByTag: { 'multi-turn': 1, regression: 1 }, percent: 66.67 },
          diff: { baselineRunId: 'baseline-run', currentRunId: 'current-run', regressions: 1, improvements: 0, changed: 1, entries: [{ key: `${profile.id}/inline/known-two-turn-probe`, profileId: profile.id, scenarioId: 'known-two-turn-probe', scenarioName: 'Known two-turn probe', baselineOutcome: 'resisted', currentOutcome: 'attackSucceeded', transition: 'regressed' }] }
        }
      }]
    };
    if (query.get('campaignStatus') === 'running') {
      const latestCampaign = campaignDashboard.campaigns[0].latest;
      latestCampaign.status = 'running';
      latestCampaign.updatedAt = 3000;
      latestCampaign.cases[0].completedAttempts = 2;
      latestCampaign.cases[0].sampleComplete = false;
      delete latestCampaign.diff;
      delete latestCampaign.baselineRunId;
    }
    const evidenceTimeline = {
      version: 1,
      baseTime: 5000,
      completeness: 'partial',
      missingPhases: ['ttft'],
      truncated: false,
      entries: [
        { id: 'request', phase: 'request', status: 'normal', label: 'Request started', at: 5000, elapsedMs: 0, location: { kind: 'network', networkId: 'stream-2' } },
        { id: 'headers', phase: 'headers', status: 'normal', label: 'Response headers received', at: 5190, elapsedMs: 190, location: { kind: 'network', networkId: 'stream-2' }, metadata: { statusCode: 200 } },
        { id: 'first-chunk', phase: 'firstChunk', status: 'normal', label: 'First response chunk', at: 5240, elapsedMs: 240, location: { kind: 'rawEvent', sequence: 2 } },
        { id: 'first-event', phase: 'firstEvent', status: 'normal', label: 'First stream event', at: 5606, elapsedMs: 606, location: { kind: 'rawEvent', sequence: 2 } },
        { id: 'mapped', phase: 'firstMappedEvent', status: 'normal', label: 'First mapped event', at: 5606, elapsedMs: 606, location: { kind: 'normalizedEvent', sequence: 2, rawSequence: 2 } },
        { id: 'finding', phase: 'finding', status: 'failure', label: 'Forbidden URL observed', at: 6840, elapsedMs: 1840, location: { kind: 'message', messageId: 'assistant-1' }, metadata: { ruleId: 'forbid.urls' } },
        { id: 'error', phase: 'error', status: 'warning', label: 'Idle timeout', at: 10200, elapsedMs: 5200, location: { kind: 'network', networkId: 'stream-2' }, metadata: { errorType: 'IdleTimeoutError' } }
      ]
    };
    const dispatch = (message) => window.dispatchEvent(new MessageEvent('message', { data: { ...envelope, ...message } }));
    window.__turnstageMessages = [];
    const applyProfilePatch = (path, value) => {
      let target = profile;
      for (let index = 0; index < path.length - 1; index += 1) {
        const key = path[index];
        const nextKey = path[index + 1];
        if (!target[key] || typeof target[key] !== 'object') target[key] = typeof nextKey === 'number' ? [] : {};
        target = target[key];
      }
      target[path.at(-1)] = value;
    };
    window.acquireVsCodeApi = () => ({
      getState: () => ({ section: query.get('section') ?? 'test', configurationSection: query.get('configurationSection') ?? undefined, rightPaneMode: query.get('rightPane') ?? undefined, inspectorTab: query.get('tab') ?? 'Raw Events', splitPercent: Number(query.get('split')) || 50, splitCustomized: query.has('split'), draft: query.get('draft') ?? '', activeEvidenceId: query.get('activeEvidence') ?? undefined, chatViewport }),
      setState: () => {},
      postMessage: (message) => {
        window.__turnstageMessages.push(JSON.parse(JSON.stringify(message)));
        if (message.type === 'profile.patch') {
          applyProfilePatch(message.path, message.value);
          setTimeout(() => dispatch({ type: 'profile.snapshot', profile: JSON.parse(JSON.stringify(profile)), version: 1, environments: ['local'] }), 0);
          return;
        }
        if (message.type === 'visual.baseline.save') {
          setTimeout(() => dispatch({ type: 'visual.result', operation: 'baseline', status: 'saved', baselinePath: '.turnstage/baselines/slow-sse-proof.png' }), 0);
          return;
        }
        if (message.type === 'visual.compare') {
          setTimeout(() => dispatch({ type: 'visual.result', operation: 'compare', status: 'passed', differencePercent: 0, baselinePath: '.turnstage/baselines/slow-sse-proof.png' }), 0);
          return;
        }
        if (message.type === 'profile.validate') {
          setTimeout(() => dispatch({ type: 'profile.validated', valid: true }), 0);
          return;
        }
        if (message.type === 'test.evidence.open') {
          const location = message.location;
          const tab = location.kind === 'network' ? 'Network' : location.kind === 'normalizedEvent' ? 'Normalized' : 'Raw Events';
          setTimeout(() => {
            dispatch({ type: 'inspector.focus', tab, evidenceId: message.evidenceId, networkId: location.networkId, sequence: location.sequence ?? location.rawSequence, messageId: location.messageId });
            dispatch({ type: 'test.timeline', evidenceId: message.evidenceId, timeline: evidenceTimeline });
          }, 0);
          return;
        }
        if (message.type === 'test.timeline.open') {
          setTimeout(() => dispatch({ type: 'test.timeline', evidenceId: message.evidenceId, timeline: evidenceTimeline }), 0);
          return;
        }
        if (message.type !== 'webview.ready') return;
        setTimeout(() => {
          dispatch({ type: 'host.ready', trusted: true, locale: 'en', direction: 'ltr' });
          dispatch({ type: 'profile.snapshot', profile, version: 1, environments: ['local'] });
          dispatch({ type: 'profile.validation', diagnostics: [] });
          dispatch({ type: 'profile.validated', valid: true });
          dispatch({ type: 'session.snapshot', snapshot: JSON.parse(JSON.stringify(snapshot)), runs: JSON.parse(JSON.stringify(runs)), requestPreview: { method: 'POST', url: 'http://localhost/chat' }, networkEntries: JSON.parse(JSON.stringify(networkEntries)) });

          dispatch({ type: 'campaign.dashboard', dashboard: campaignDashboard });
          dispatch({ type: 'test.results', results: [{ profileId: profile.id, scenarioId: 'known-two-turn-probe', scenarioName: 'Known two-turn probe', outcome: 'attackSucceeded', durationMs: 1840, attemptedTurns: 2, completedTurns: 2, plannedTurns: 2, findingCount: 1, issueCount: 0, primaryFinding: { category: 'url', turnId: 'attack', turnIndex: 1, ruleId: 'forbid.urls', label: 'Forbidden URL observed' }, evidenceId: 'visual-evidence', primaryLocation: { kind: 'message', messageId: 'assistant-1' }, availableLocations: [{ kind: 'message', messageId: 'assistant-1' }, { kind: 'normalizedEvent', sequence: 4 }], repetitions: { requestedAttempts: 5, completedAttempts: 5, skippedAttempts: 0, sampleComplete: true, stability: 'unstable', counts: { resisted: 3, attackSucceeded: 2, indeterminate: 0, infrastructureError: 0 } }, reliability: { requestedAttempts: 5, completedAttempts: 5, evaluableAttempts: 5, coveragePercent: 100, resistanceRate: 0.6, attackRate: 0.4, resistanceInterval: { confidenceLevel: 0.95, status: 'smallSample', lower: 0.23, upper: 0.88 }, ttftP95Ms: 1808, durationP95Ms: 3612, verdict: 'doesNotMeetTarget', reasons: ['Resistance target was not met.'] } }] });
        }, 0);
      }
    });
  </script>
  <script src="../../dist/webview.js"></script>
